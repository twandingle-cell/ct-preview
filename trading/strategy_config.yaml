# strategy_config — Twan (Robinhood Agentic)
#
# v1: parsed from Twan's original answers (2026-07-03).
# v2 (2026-07-03, same day): superseded by Twan's full rules-based spec —
# tightened max_deployment_pct to 30%, added SPY as a flex instrument driven
# by daily Discord (Chris) levels, and added decision-priority / reporting
# detail. Where v2 conflicts with v1, v2 wins; fields below reflect v2.

account:
  label: "Twan – Robinhood Agentic"
  capital_funded_usd: 100
  # Account 793965849 confirmed funded at $100 cash / $100 buying power via
  # get_portfolio on 2026-07-03. Scale this value (not max_deployment_pct)
  # when adding more funds.

deployment:
  max_deployment_pct: 0.30
  # Superseded from the original 1.0 (100%) "aggressive" default — Twan's
  # follow-up spec explicitly sets this to 30% of funded account "unless I
  # change it." Treat 30% as the current ceiling until he says otherwise.
  max_position_pct: 0.05          # 5% of account value per ticker, never exceeded
  max_active_tickers_range: [6, 8]
  stagger_entries: false          # single clean entry, no multi-tranche scaling

risk:
  risk_tolerance: 5               # 1-5 scale, 5 = aggressive
  max_daily_loss_stop_pct: 10     # stop trading for the day if hit
  max_weekly_loss_stop_pct: 20    # stop trading for the week if hit
  stop_loss_pct_range: [7, 10]    # tight, logical stops below entry
  take_profit_pct_range: [15, 25] # take profit into strength when stretched
  close_or_reduce_if_price_closes_below_200dma: true
  no_aggressive_averaging_down: true
  no_chasing_extended_moves: true
  skip_trade_if_market_conditions_unclear: true

instruments:
  equities: allowed
  options:
    live_orders: disallowed
    # Stocks-only execution strategy. Never place a live option order unless
    # Twan explicitly and clearly authorizes a workflow that supports it.
    simulate_via_stock_sizing: true
    # If Twan floats an option-style idea, translate it into stock logic
    # with a defined entry, stop, and target — don't assume options are allowed.
  futures: disallowed
  margin: disallowed
  short_selling: disallowed
  crypto: disallowed

fractional_shares_allowed: true

universe:
  allowed_caps: large_cap_only
  hard_filters:
    min_price_per_share_usd: 5
    min_avg_daily_volume_shares: 1000000
  primary_themes: [AI_semiconductors]
  core_tickers: [NVDA, AAPL, MU, NBIS, WDC, STX, GOOGL, META, NFLX, PLTR, TSLA]
  flex_instruments: [SPY]
  # SPY (and other large-cap tech outside the core list) may be traded when
  # the setup is strong, subject to the same hard_filters and the daily_levels
  # workflow below for SPY specifically.
  allow_new_tickers_in_theme: true
  # A new ticker outside core_tickers may be proposed only if it passes
  # hard_filters, gets a one-sentence justification, and (first trade only)
  # gets Twan's explicit text approval.

style:
  core_style: short_term_swing
  trade_frequency: daily
  allow_same_day_round_trip: true
  hold_time_days: [1, 5]
  avoid_after_hours: false
  after_hours_rules:
    order_type: limit_only
    sizing: conservative
    slippage_tolerance_pct_max: 0.2
    skip_and_log_if_spread_too_wide: true

signals:
  trend_filter:
    require_price_above_50dma: true
    prefer_50dma_above_200dma: true   # even stronger setup, not a hard gate on its own
    no_new_longs_if_trend_unhealthy: true
  dip_entry:
    prefer_red_days_over_chasing_green: true
    pullback_from_10d_high_pct_range: [3, 6]   # adapt within range per volatility
    require_price_above_50dma: true
    preferred_names: [NVDA, TSLA, AAPL, GOOGL, META, PLTR]
    avoid_catastrophic_news_dips: true
  exit_rules:
    take_profit_into_strength_when_stretched: true
    use_tight_logical_stops: true
    exit_without_hesitation_if_momentum_or_setup_breaks: true
    reduce_or_close_if_no_longer_aligned_with_trend: true

daily_levels_workflow:
  # Each trading day, Twan may paste a Discord post from Chris with SPY and
  # TSLA support/resistance levels.
  source: "Discord post from Chris (SPY + TSLA levels)"
  ask_if_not_provided: true
  # Before acting each day, ask Twan for the latest levels if he hasn't
  # already pasted them.
  role: confirmation_layer_not_blind_signal
  spy:
    prefer_longs: "near posted support, or on a clean break above posted resistance"
    avoid_middle_of_range: true
  tsla:
    prefer_longs: "near the posted pullback/retest zone, only if trend and liquidity still support the trade"
    avoid_middle_of_range: true
  conflict_resolution: "if posted levels conflict with trend, volume, or risk rules, Twan's rules win"
  skip_if_price_too_far_from_posted_level: true

execution:
  order_type_preference: limit_orders_primary
  slippage_tolerance_pct: 0.3      # tight default for liquid large caps (range 0.2-0.5%)
  choose_best_limit_using_market_context: true
  avoid_bad_fills: true
  one_new_entry_per_ticker_per_day: true
  cancel_and_reevaluate_if_unfilled_beyond_slippage: true
  pre_trade_checks: [current_positions, cash, open_orders, account_value, risk_limits]

decision_priority:
  # Order used when reasoning about any trade decision.
  - risk_rules
  - liquidity_and_price_filters
  - trend
  - daily_discord_levels
  - entry_quality
  - position_sizing
  - execution_quality

reporting:
  rationale_detail_level: one_sentence
  persistent_trade_log: true
  trade_log_path: trading/trade_log.md
  trade_log_fields: [datetime, ticker, action, quantity, price, rationale, signal_type, risk_notes, result_after_exit]
  performance_summary_frequency: daily
  daily_summary_fields: [current_positions, cash_and_deployed_capital, open_orders, unrealized_and_realized_pnl, what_changed_today, risk_limits_hit, tomorrows_watchlist]

trade_proposal_fields:
  # What every confirm-mode trade idea must include, in this order. Applies
  # to every recommended play — Agentic stock trades AND manual options
  # ideas alike. stop_loss_level and take_profit_level are always explicit
  # numeric levels, never left as vague "exit logic" prose.
  - ticker
  - direction
  - entry_zone
  - stop_loss_level      # explicit price (underlying, and premium % for options)
  - take_profit_level    # explicit price/target(s) (underlying, and premium % for options)
  - position_size
  - one_sentence_rationale
  - signal_source   # trend | pullback | daily_discord_levels

manual_options_plays:
  # For options ideas given for Twan's own manual execution (never placed
  # live via Agentic — see instruments.options above). Every play must state:
  contract_fields: [ticker, expiration, strike, direction]
  stop_loss:
    # Whichever triggers first invalidates the trade.
    underlying_invalidation_level: required   # e.g. "SPY closes below $743"
    premium_stop_pct: "~35% loss on premium as a backstop"
  take_profit:
    # Partial-then-runner is the default shape; state explicit levels for both.
    partial_target: "explicit underlying level or ~50-75% premium gain"
    runner_target: "explicit further underlying level, trail stop after"

guardrails:
  daily_loss_stop:
    threshold_pct: 10
    action: "stop opening new positions; only manage/close existing; log with one-sentence explanation"
  weekly_loss_stop:
    threshold_pct: 20
    action: "halt all new trades; ask Twan explicitly whether to continue or reset"
  no_penny_stocks: true
  after_hours_widened_spread: "skip the trade and log why"

autonomy:
  mode: confirm
  # confirm: every proposed trade uses trade_proposal_fields above and waits
  #          for plain-text approval before any order is placed.
  # auto:    entered only after Twan explicitly says "switch to auto mode".
  #          All risk/guardrail and logging rules still apply in auto mode.
  confirm_phrases: ["approve", "yes"]
  switch_to_auto_phrase: "switch to auto mode"

behavior:
  - be disciplined, concise, consistent
  - do not overtrade
  - do not invent reasons
  - if a setup is weak, say no trade
  - if the market is messy, wait

scope:
  account_restriction: "Only the dedicated Robinhood Agentic account. Never touch other Robinhood accounts or balances."
  on_mcp_or_auth_failure: "stop trading, log the issue, ask Twan to re-authenticate — do not retry blindly"
