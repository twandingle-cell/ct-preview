        --text-muted:     #898781;

        --axis:           #c3c2b7;

          --good:           #0ca30c;
          --critical:       #e66767;
        }

      body { background: var(--page); color: var(--text-primary); }
      .card { border: 1px solid var(--border); background: var(--surface-1); border-radius: 1rem; box-shadow: 0 1px 2px rgba(16,24,40,0.06); }
      .card-header { border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; }
      .card-title { font-weight: 600; font-size: 1rem; }
      .card-content { padding: 0.75rem 1rem; }
      .muted { color: var(--text-muted); }
      .secondary { color: var(--text-secondary); }
      .tabular { font-variant-numeric: tabular-nums; }
      .pill { display:inline-flex; align-items:center; gap:0.3rem; border-radius:9999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
      table.jr th { text-align: left; font-weight: 500; color: var(--text-muted); padding: 6px 10px; border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface-1); }
      table.jr td { padding: 6px 10px; border-bottom: 1px solid var(--grid); }
      table.jr tr:last-child td { border-bottom: none; }
      input.search { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 0.5rem; padding: 0.4rem 0.7rem; font-size: 0.875rem; }
    </style>

      function Badge({ gain }) {
        if (gain > 0) return <span className="pill" style={{color:"var(--good)", background:"rgba(12,163,12,0.12)"}}>▲ WIN</span>;
        if (gain < 0) return <span className="pill" style={{color:"var(--critical)", background:"rgba(208,59,59,0.12)"}}>▼ LOSS</span>;
        return <span className="pill secondary" style={{background:"rgba(137,135,129,0.15)"}}>FLAT</span>;
      }

      function KPI({ label, value, sub, tone }) {
        const color = tone === "good" ? "var(--good)" : tone === "critical" ? "var(--critical)" : "var(--text-primary)";
        return (
          <div className="card">
            <div className="card-header"><div className="text-sm secondary">{label}</div></div>
            <div className="card-content">
              <div className="text-3xl font-semibold tabular" style={{ color }}>{value}</div>
              {sub && <div className="text-xs muted mt-1">{sub}</div>}
            </div>
          </div>
        );
      }

      function EquityCurveChart({ points }) {

            </ComposedChart>
          </ResponsiveContainer>

        return (

              <ReferenceLine x={0} stroke="var(--axis)" />
              <Tooltip
                contentStyle={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 8, fontSize: 12 }}
                formatter={(v)=>[fmtUsd(v), "Realized P&L"]}
              />

                {data.map((d, i) => <Cell key={i} fill={d.total >= 0 ? "var(--series-1)" : "var(--critical)"} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        );
      }

      function App() {
        const [query, setQuery] = useState("");

        const trades = useMemo(() => {
          const sorted = [...RAW_TRADES].sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
          return sorted;
        }, []);

        const stats = useMemo(() => {
          const decided = RAW_TRADES.filter(t => t.gain !== 0);
          const wins = decided.filter(t => t.gain > 0);
          const losses = decided.filter(t => t.gain < 0);
          const totalPnl = RAW_TRADES.reduce((s,t)=> s + t.gain, 0);
          const best = RAW_TRADES.reduce((a,b)=> b.gain > a.gain ? b : a, RAW_TRADES[0]);
          const worst = RAW_TRADES.reduce((a,b)=> b.gain < a.gain ? b : a, RAW_TRADES[0]);
          return {
            totalPnl,
            totalTrades: RAW_TRADES.length,
            winRate: decided.length ? (wins.length / decided.length) * 100 : 0,
            wins: wins.length,
            losses: losses.length,
            best, worst,
          };
        }, []);

          const asc = [...RAW_TRADES].sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));
          let running = 0;
          return asc.map(t => {
            running += t.gain;
            return { label: fmtDate(t.timestamp), cumulative: Number(running.toFixed(2)) };
          });
        }, []);

          const map = {};
          for (const t of RAW_TRADES) {
            if (t.symbol === "OTHER") continue;
            map[t.symbol] = (map[t.symbol] || 0) + t.gain;
          }
          return Object.entries(map)
            .map(([symbol, total]) => ({ symbol, total: Number(total.toFixed(2)) }))
            .sort((a,b)=> Math.abs(b.total) - Math.abs(a.total))
            .slice(0, 12)
            .sort((a,b)=> a.total - b.total);
        }, []);

        const filteredTrades = useMemo(() => {
          if (!query.trim()) return trades;
          const q = query.trim().toUpperCase();
          return trades.filter(t => t.symbol.includes(q));
        }, [trades, query]);

        return (

                  <span className="ml-2 inline-flex items-center rounded-full px-2 py-1 text-xs secondary" style={{ background: "var(--grid)" }}>Robinhood Agentic · ••••0737</span>
                </div>
                <div className="text-xs muted">Snapshot · all-time · not investment advice</div>
              </div>
            </div>

            <div className="mx-auto grid max-w-7xl gap-4 px-4 py-4 md:grid-cols-4">
              <KPI label="Total realized P&L" value={fmtUsd(stats.totalPnl)} sub={`${stats.totalTrades} closed trades`} tone={stats.totalPnl >= 0 ? "good" : "critical"} />
              <KPI label="Win rate" value={`${stats.winRate.toFixed(0)}%`} sub={`${stats.wins}W / ${stats.losses}L`} />
              <KPI label="Best trade" value={fmtUsd(stats.best.gain)} sub={`${stats.best.symbol} · ${fmtDate(stats.best.timestamp)}`} tone="good" />
              <KPI label="Worst trade" value={fmtUsd(stats.worst.gain)} sub={`${stats.worst.symbol} · ${fmtDate(stats.worst.timestamp)}`} tone="critical" />

              <div className="md:col-span-4 grid grid-cols-1 gap-4 lg:grid-cols-3">
                <div className="card lg:col-span-2">
                  <div className="card-header"><div className="card-title">Cumulative realized P&L</div></div>
                  <div className="card-content"><EquityCurveChart points={equityCurve} /></div>
                </div>
                <div className="card">
                  <div className="card-header"><div className="card-title">P&L by symbol (top 12 by |P&L|)</div></div>
                  <div className="card-content"><SymbolPnlChart data={bySymbol} /></div>
                </div>
              </div>

              <div className="md:col-span-4 card">
                <div className="card-header flex items-center justify-between">
                  <div className="card-title">Trade log ({filteredTrades.length})</div>
                  <input className="search" placeholder="Filter by symbol…" value={query} onChange={e=>setQuery(e.target.value)} />
                </div>
                <div className="card-content overflow-x-auto" style={{ maxHeight: 420, overflowY: "auto" }}>
                  <table className="jr w-full text-sm">
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Symbol</th>
                        <th className="text-right">Qty</th>
                        <th className="text-right">Price</th>
                        <th className="text-right">Realized P&L</th>
                        <th>Result</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredTrades.map((t, i) => (
                        <tr key={i}>
                          <td className="secondary tabular">{fmtDate(t.timestamp)}</td>
                          <td className="font-medium">{t.symbol}</td>
                          <td className="text-right tabular secondary">{fmtQty(t.quantity)}</td>
                          <td className="text-right tabular secondary">{t.price ? fmtUsd(t.price) : "—"}</td>
                          <td className="text-right tabular font-medium" style={{ color: t.gain > 0 ? "var(--good)" : t.gain < 0 ? "var(--critical)" : "var(--text-secondary)" }}>{fmtUsd(t.gain)}</td>
                          <td><Badge gain={t.gain} /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="md:col-span-2 card">
                <div className="card-header"><div className="card-title">Open equity positions ({OPEN_EQUITY.length})</div></div>
                <div className="card-content overflow-x-auto" style={{ maxHeight: 320, overflowY: "auto" }}>
                  <table className="jr w-full text-sm">
                    <thead><tr><th>Symbol</th><th className="text-right">Qty</th><th className="text-right">Avg cost</th></tr></thead>
                    <tbody>
                      {OPEN_EQUITY.map((p,i)=>(
                        <tr key={i}>
                          <td className="font-medium">{p.symbol}</td>
                          <td className="text-right tabular secondary">{fmtQty(p.qty)}</td>
                          <td className="text-right tabular secondary">{fmtUsd(p.avgCost)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="md:col-span-2 card">
                <div className="card-header"><div className="card-title">Open option positions ({OPEN_OPTIONS.length})</div></div>
                <div className="card-content overflow-x-auto" style={{ maxHeight: 320, overflowY: "auto" }}>
                  <table className="jr w-full text-sm">
                    <thead><tr><th>Symbol</th><th>Side</th><th className="text-right">Contracts</th><th className="text-right">Avg cost</th><th>Expiration</th></tr></thead>
                    <tbody>
                      {OPEN_OPTIONS.map((p,i)=>(
                        <tr key={i}>
                          <td className="font-medium">{p.symbol}</td>
                          <td className="secondary capitalize">{p.type}</td>
                          <td className="text-right tabular secondary">{p.qty}</td>
                          <td className="text-right tabular secondary">{fmtUsd(p.avgCost)}</td>
                          <td className="secondary tabular">{p.expiration}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <footer className="border-t" style={{ borderColor: "var(--border)" }}>
              <div className="mx-auto max-w-7xl px-4 py-4 text-xs muted">
                Pulled from the Robinhood Agentic Trading MCP (get_pnl_trade_history, get_equity_positions, get_option_positions) on the account ending 0737. Figures are informational only, not a tax document or trading advice.
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
